<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Engine</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }

        .searchEngine {
            width: 80%;
            margin: auto;
        }

        input {
            width: 60%;
            padding: 10px;
            margin: 20px 0;
            font-size: 16px;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }

        button {
            padding: 5px 10px;
            margin-top: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="searchEngine">
        <h2>Search Products</h2>
        <input id="inputSearch" type="text" placeholder="Search for any item...">
        <div id="results" class="results"></div>
    </div>

    <script type="module" src="./src/main.js"></script>

</body>
</html>
