<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Timings</title>
</head>
<body>
    <nav>
        <div>
            <img src="./logo.png" alt="">
            <h1>Gym Time</h1>
        </div>
    </nav>

    <section class="hero">
        <div class="one">
            <h4>Premium Gym Equipment</h4>
            <p>No Hassle Free Delivary</p>
            <img src="./b2 (1).jpg" alt="">
        </div>
        <div class="two">
            <form action="">
                <input type="text" name="username" id="Name" placeholder="Name">
                <input type="text" name="email" id="Name" placeholder="Email">
                <div class="gender">
                    <input type="radio" name="gender" id="male" value="Male"><label for="Male">Male</label>
                    <input type="radio" name="gender" value="Female"><label for="Female">Female</label>
                </div>
                <div class="checkboxes">
                    <input type="checkbox" value="Weights" name="equipment"><label for="Weights">Weights</label>
                    <input type="checkbox" value="Dumbells" name="equipment"><label for="Dumbells">Dumbells</label>
                    <input type="checkbox" value="Ropes" name="equipment"><label for="Ropes">Ropes</label>
                    <input type="checkbox" value="Shirts" name="equipment"><label for="Shirts">Shirts</label>
                </div>
                <input type="submit" name="submit" id="submit">
            </form>
        </div>
    </section>

    <sections class="equipments_list">
        <h3>Get your latest equipment</h3>
        <div class="cards">
            <div class="card"> <img src="./dumbles.png" alt=""></div>
            <div class="card"> <img src="./eq2.jpg" alt=""></div>
            <div class="card"> <img src="./eq3.jpg" alt=""></div>
            <div class="card"> <img src="./eq1.jpg" alt=""></div>
        </div>
    </sections>

    <section class="segments">
        <div class="segmentA">
            <h3>Equipment</h3>
            <img src="./bag.jpg" alt="">
        </div>
        <div class="segmentB">
            <h3>MemberShip</h3>
            <img src="./MEMBERSHIP.png" alt="">
        </div>
    </section>

   
</body>
</html>
