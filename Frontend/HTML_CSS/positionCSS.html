<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
    <style>
        html, body {
            height: 150%;
            align-items: center;
            margin-left: 5%;
        }

        .div{
            background-color: brown;
            height: 50%;
            width: 100%;    
        }
        .card1{
          background-color: blanchedalmond;
          width: 20%;
          height: 20%;
          position: absolute;
          margin-left: 70%;
          margin-top: 50%;
        }
        .card2{
            background-color: black;
          width: 20%;
          height: 20%;
        }
        .card3{
            background-color: blue;
          width: 20%;
          height: 20%;
        }
        .card4{
            background-color: green;
          width: 20%;
          height: 20%;
        }
        
    </style>
</head>
<body>
    <div class="div">
        <div class="card1"></div>
        <div class="card2"></div>
        <div class="card3"></div>
        <div class="card4"></div>
    </div>
</body>
</html>
