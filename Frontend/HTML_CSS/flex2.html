<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flexbox{
             width: 600px;
            height: 500px;
            background-color: gray;
            margin: 0.7rem;
            display: flex;
            position: relative;
            
        }
        .box{
            height: 150px;
            width: 200px;
            background-color: aqua;
            margin: 0.7rem;
            margin-top: 0.8rem;
            padding-top: 0.3rem;
            
        }
        .one{
            background-color: black;
            position: absolute;
            margin-left: 20rem;
            margin-top: 18rem;
            
        }
        .two{
            background-color: antiquewhite;
            position: absolute;
            margin-left: 14rem;
            margin-top: 11rem;
        }
        .three{
            background-color: blue;
            margin-top: 4rem;
            margin-left: 5rem;
            position: relative;
        }
        .four{
            background-color: blueviolet;
            position: absolute;
            margin-left: 20rem;
            margin-top: 4rem;
        }
        .five{
            background-color: chartreuse;
            position: absolute;
            margin-top: 18rem;
            margin-left: 5rem;
        }
    </style>
</head>
<body>
    <div class="flexbox">
        <div class="box one"></div>
        <div class="box two"></div>
        <div class="box three"></div>
        <div class="box four"></div>
        <div class="box five"></div>
    </div>
</body>
</html>
